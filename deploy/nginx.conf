# Nginx 反代配置模板（Ubuntu/Debian）
# 用法: 复制到 /etc/nginx/sites-available/chat-monitor，改域名后启用
#   sudo ln -s /etc/nginx/sites-available/chat-monitor /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP：跳转 HTTPS ──
server {
    listen 80;
    server_name your-domain.com;   # ← 改成你的域名（或用服务器 IP 直连时删除 443 段）

    location / {
        return 301 https://$host$request_uri;
    }

    # ── 自定义错误页面 ──
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    location /errors/ {
        alias /opt/chat-monitor/web/static/errors/;
        internal;   # 仅允许 Nginx 内部跳转，禁止直接访问
    }
}

# ── HTTPS ──
server {
    listen 443 ssl http2;
    server_name your-domain.com;   # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 反代 FastAPI（只监听本机 8001）
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 覆盖客户端伪造值
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 静态资源直接由 Nginx 服务（可选，加速）
    location /static/ {
        alias /opt/chat-monitor/web/static/;
        expires 7d;
    }

    # ── 自定义错误页面 ──
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    location /errors/ {
        alias /opt/chat-monitor/web/static/errors/;
        internal;   # 仅允许 Nginx 内部跳转，禁止直接访问
    }
}
