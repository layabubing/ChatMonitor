<svg width="1160" height="260" viewBox="0 0 1160 260" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1160" height="260" rx="12" fill="#F7F9FC" /><rect x="30" y="60" width="180" height="140" rx="10" fill="#FFFFFF" stroke="#3D7BD9" stroke-width="1.5" /><text x="120" y="100" font-size="15" font-weight="bold" fill="#0E3F8C" text-anchor="middle">群聊新消息</text><text x="120" y="126" font-size="12" fill="#4A5568" text-anchor="middle">QQ / 钉钉群</text><text x="120" y="148" font-size="12" fill="#4A5568" text-anchor="middle">worker 实时接收</text><text x="120" y="170" font-size="12" fill="#4A5568" text-anchor="middle">入库 + 判定</text><path d="M 210 130 L 270 130" stroke="#1E4FA8" stroke-width="2.5" /><polygon points="265,125 275,125 270,135" fill="#1E4FA8" /><text x="240" y="112" font-size="12" fill="#8B97A8" text-anchor="middle">入库</text><rect x="275" y="60" width="180" height="140" rx="10" fill="#FFFFFF" stroke="#3D7BD9" stroke-width="1.5" /><text x="365" y="100" font-size="15" font-weight="bold" fill="#0E3F8C" text-anchor="middle">SQLite 数据库</text><text x="365" y="126" font-size="12" fill="#4A5568" text-anchor="middle">消息 / 提醒 / 报告</text><text x="365" y="148" font-size="12" fill="#4A5568" text-anchor="middle">增量游标记录</text><text x="365" y="170" font-size="12" fill="#4A5568" text-anchor="middle">MAX(ts/id)</text><path d="M 455 130 L 515 130" stroke="#1E4FA8" stroke-width="2.5" /><polygon points="510,125 520,125 515,135" fill="#1E4FA8" /><text x="485" y="112" font-size="12" fill="#8B97A8" text-anchor="middle">2s 扫描</text><rect x="520" y="60" width="200" height="140" rx="10" fill="#FFFFFF" stroke="#1E4FA8" stroke-width="2" /><text x="620" y="100" font-size="15" font-weight="bold" fill="#0E3F8C" text-anchor="middle">SSE 广播管理器</text><text x="620" y="126" font-size="12" fill="#4A5568" text-anchor="middle">发现增量</text><text x="620" y="148" font-size="12" fill="#4A5568" text-anchor="middle">推送事件到</text><text x="620" y="170" font-size="12" fill="#4A5568" text-anchor="middle">所有在线连接</text><path d="M 720 130 L 780 130" stroke="#1E4FA8" stroke-width="2.5" /><polygon points="775,125 785,125 780,135" fill="#1E4FA8" /><rect x="785" y="60" width="340" height="140" rx="10" fill="#F0F5FC" stroke="#1E4FA8" stroke-width="1.5" /><text x="955" y="100" font-size="15" font-weight="bold" fill="#0E3F8C" text-anchor="middle">浏览器（EventSource 监听）</text><text x="955" y="128" font-size="13" fill="#1A2230" text-anchor="middle">新消息 → 列表即时刷新</text><text x="955" y="152" font-size="13" fill="#1A2230" text-anchor="middle">新提醒 → 弹条提示 + 角标</text><text x="955" y="176" font-size="13" fill="#1A2230" text-anchor="middle">新报告/文件 → 即时出现</text></svg>