<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 聊天智能分析助手</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.login-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 36px; width: 100%; max-width: 380px; }
.login-card h1 { font-size: 20px; margin-bottom: 6px; color: #fff; text-align: center; }
.login-card .sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 22px; }
.mode-tabs { display: flex; background: #141821; border-radius: 10px; overflow: hidden; margin-bottom: 22px; }
.mode-tabs button { flex: 1; background: none; border: none; color: var(--muted); padding: 9px; cursor: pointer; font-size: 14px; font-weight: 600; }
.mode-tabs button.active { background: var(--accent); color: #fff; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field input { width: 100%; }
.btn-login { width: 100%; padding: 11px; font-size: 15px; margin-top: 8px; }
.err { color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
.ok { color: var(--ok); font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>🐱 聊天智能分析助手</h1>
    <div class="sub">QQ · 钉钉 群聊监控与分析</div>
    <div class="mode-tabs">
      <button id="tabLogin" class="active">登 录</button>
      <button id="tabRegister">注 册</button>
    </div>
    <form id="authForm" autocomplete="off">
      <div class="field"><label>用户名</label><input type="text" id="username" autocomplete="username" required></div>
      <div class="field"><label>密码</label><input type="password" id="password" autocomplete="current-password" required></div>
      <div class="field" id="pwd2Wrap" style="display:none"><label>确认密码</label><input type="password" id="password2" autocomplete="new-password"></div>
      <div class="field" id="inviteWrap" style="display:none"><label>邀请码（如有）</label><input type="text" id="inviteCode"></div>
      <button class="btn primary btn-login" type="submit" id="submitBtn">登 录</button>
      <div class="err" id="msg"></div>
      <div class="ok" id="okMsg"></div>
    </form>
  </div>
</div>
<script>
let mode = 'login';
function setMode(m) {
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m === 'login');
  document.getElementById('tabRegister').classList.toggle('active', m === 'register');
  document.getElementById('pwd2Wrap').style.display = m === 'register' ? '' : 'none';
  document.getElementById('inviteWrap').style.display = m === 'register' ? '' : 'none';
  document.getElementById('submitBtn').textContent = m === 'login' ? '登 录' : '注 册';
  document.getElementById('msg').textContent = '';
  document.getElementById('okMsg').textContent = '';
}
document.getElementById('tabLogin').addEventListener('click', () => setMode('login'));
document.getElementById('tabRegister').addEventListener('click', () => setMode('register'));

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const okMsg = document.getElementById('okMsg');
  msg.textContent = ''; okMsg.textContent = '';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  try {
    if (mode === 'register') {
      const p2 = document.getElementById('password2').value;
      if (password !== p2) { msg.textContent = '两次密码不一致'; return; }
      const r = await fetch('/api/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password, invite_code: document.getElementById('inviteCode').value.trim()})
      });
      const d = await r.json();
      if (!r.ok) { msg.textContent = d.error || '注册失败'; return; }
      okMsg.textContent = '✅ 注册成功，正在登录…';
      // 自动登录
      const lr = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      if (lr.ok) { location.href = '/'; } else { setMode('login'); msg.textContent = '请手动登录'; }
    } else {
      const r = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      const d = await r.json();
      if (!r.ok) { msg.textContent = d.error || '登录失败'; return; }
      location.href = '/';
    }
  } catch { msg.textContent = '网络错误'; }
});
</script>
</body>
</html>
