<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聊天智能分析助手</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
  <div class="logo">🐱 聊天<span>分析助手</span></div>
  <nav class="tabs">
    <div class="tab active" data-page="overview">总览</div>
    <div class="tab" data-page="messages">消息</div>
    <div class="tab" data-page="reports">报告</div>
    <div class="tab" data-page="alerts">提醒<span id="alertBadge" style="display:none;background:var(--danger);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px"></span></div>
    <div class="tab" data-page="files">文件库</div>
    <div class="tab" data-page="settings">设置</div>
  </nav>
  <div class="top-right"><span id="who"></span><button class="btn-logout" id="logout">退出</button></div>
</div>

<div class="container">
  <!-- 总览 -->
  <div class="page active" id="page-overview">
    <div class="platform-grid" id="overviewGrid"></div>
  </div>

  <!-- 消息 -->
  <div class="page" id="page-messages">
    <div class="filters">
      <div class="seg" id="msgPlatform">
        <button data-p="qq" class="active">QQ</button>
        <button data-p="dingtalk">钉钉</button>
      </div>
      <select id="msgGroup"><option value="">全部群</option></select>
      <input type="text" id="msgQ" placeholder="搜索关键词…">
      <button class="btn" id="msgSearch">搜索</button>
    </div>
    <div class="card"><div id="msgList"></div>
      <div class="pager">
        <button class="btn sm" id="msgPrev">上一页</button>
        <span id="msgPageInfo">第 1 页</span>
        <button class="btn sm" id="msgNext">下一页</button>
      </div>
    </div>
  </div>

  <!-- 报告 -->
  <div class="page" id="page-reports">
    <div class="filters">
      <div class="seg" id="repPlatform">
        <button data-p="" class="active">全部</button>
        <button data-p="qq">QQ</button>
        <button data-p="dingtalk">钉钉</button>
      </div>
      <button class="btn" id="repRefresh">刷新</button>
    </div>
    <div class="card">
      <div id="repList"></div>
      <div class="report-preview" id="repPreview" style="display:none">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
          <b id="repPreviewTitle"></b>
          <a class="btn sm" id="repDownloadDocx" href="#" download>下载 docx</a>
          <button class="btn sm" id="repClosePreview">关闭</button>
        </div>
        <iframe id="repIframe"></iframe>
      </div>
    </div>
  </div>

  <!-- 提醒 -->
  <div class="page" id="page-alerts">
    <div class="filters">
      <div class="seg" id="alertPlatform">
        <button data-p="" class="active">全部</button>
        <button data-p="qq">QQ</button>
        <button data-p="dingtalk">钉钉</button>
      </div>
      <button class="btn" id="alertAllRead">全部标记已读</button>
    </div>
    <div id="alertList"></div>
  </div>

  <!-- 文件库 -->
  <div class="page" id="page-files">
    <div class="filters">
      <div class="seg" id="filePlatform">
        <button data-p="" class="active">全部</button>
        <button data-p="qq">QQ</button>
        <button data-p="dingtalk">钉钉</button>
      </div>
      <select id="fileCategory"><option value="">全部分类</option></select>
      <label style="display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px">
        <input type="checkbox" id="fileImportant"> 仅重要</label>
      <input type="text" id="fileQ" placeholder="搜索文件名/描述…">
      <button class="btn" id="fileSearch">搜索</button>
    </div>
    <div class="card"><div id="fileList"></div>
      <div class="pager">
        <button class="btn sm" id="filePrev">上一页</button>
        <span id="filePageInfo"></span>
        <button class="btn sm" id="fileNext">下一页</button>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div class="page" id="page-settings">
    <div class="card" id="meCard">
      <h3>👤 我的账号</h3>
      <div class="settings-row"><span class="label">用户名</span><span id="setUser"></span></div>
      <div class="settings-row"><span class="label">角色</span><span id="setRole"></span></div>
      <div class="settings-row">
        <span class="label">昵称（≤24字）</span>
        <span style="display:flex;gap:8px"><input type="text" id="meNick" placeholder="给自己起个昵称"><button class="btn primary sm" id="saveNick">保存昵称</button></span>
      </div>
      <div class="settings-row">
        <span class="label">修改密码（≥6位）</span>
        <span style="display:flex;gap:8px"><input type="password" id="oldPwd" placeholder="旧密码"><input type="password" id="newPwd" placeholder="新密码"><button class="btn primary sm" id="savePwd">保存</button></span>
      </div>
    </div>
    <div class="card">
      <h3>🔗 我的 QQ 账号绑定</h3>
      <div class="bind-row"><label>AppID</label><input type="text" id="qq_app_id" placeholder="QQ 开放平台 AppID"></div>
      <div class="bind-row"><label>AppSecret</label><input type="password" id="qq_app_secret" placeholder="已设置则留空不变"></div>
      <div class="bind-row"><label>环境</label>
        <select id="qq_env"><option value="prod">正式环境</option><option value="sandbox">沙箱环境</option></select></div>
      <div class="bind-row"><label>监控群 openid（逗号分隔，留空=全部）</label><input type="text" id="qq_groups"></div>
      <div class="bind-row"><label>启用</label>
        <select id="qq_enabled"><option value="true">启用</option><option value="false">停用</option></select></div>
      <div class="actions" style="margin-top:12px;display:flex;gap:8px">
        <button class="btn" id="qq_test">测试连接</button>
        <button class="btn primary" id="qq_save">保存并重启</button>
      </div>
      <div class="bind-status" id="qq_status"></div>
    </div>
    <div class="card">
      <h3>🔗 我的钉钉账号绑定</h3>
      <div class="bind-row"><label>AppKey</label><input type="text" id="dt_app_key" placeholder="钉钉企业内部应用 AppKey"></div>
      <div class="bind-row"><label>AppSecret</label><input type="password" id="dt_app_secret" placeholder="已设置则留空不变"></div>
      <div class="bind-row"><label>监控群 chatId（逗号分隔）</label><input type="text" id="dt_chat_ids"></div>
      <div class="bind-row"><label>启用</label>
        <select id="dt_enabled"><option value="true">启用</option><option value="false">停用</option></select></div>
      <div class="actions" style="margin-top:12px;display:flex;gap:8px">
        <button class="btn" id="dt_test">测试连接</button>
        <button class="btn primary" id="dt_save">保存并重启</button>
      </div>
      <div class="bind-status" id="dt_status"></div>
    </div>
    <div class="card">
      <h3>🤖 AI 模型（<span id="aiModelName">…</span>）</h3>
      <div id="aiInfo"></div>
    </div>
    <div class="card">
      <h3>📌 我的关键词库</h3>
      <div id="kwGroups"></div>
      <button class="btn primary" id="saveKw">保存关键词</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
